name: Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must use Semantic Versioning, for example v2.1.0" >&2
            exit 1
          fi
          echo "name=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 2))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew ktlintCheck detekt lintRelease testReleaseUnitTest assembleRelease
          -PVERSION_NAME=${{ steps.version.outputs.name }}
          -PVERSION_CODE=${{ steps.version.outputs.code }}
      - name: Verify and package APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir dist
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "dist/tv-key-mapper-$VERSION_NAME.apk"
          cd dist
          sha256sum "tv-key-mapper-$VERSION_NAME.apk" > "tv-key-mapper-$VERSION_NAME.apk.sha256"
      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
